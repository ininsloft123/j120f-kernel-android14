name: Build Android 14-Ready Kernel (Exynos 3475 / J1 2016)

on:
  push:
      paths:
            - '.github/workflows/build_kernel_a14.yml'
              workflow_dispatch:

              jobs:
                build:
                    runs-on: ubuntu-22.04
                        timeout-minutes: 90

                            steps:
                                  - name: Install Build Dependencies
                                          run: |
                                                    sudo apt update -qq
                                                              sudo apt install -y build-essential libncurses5-dev bison flex libssl-dev bc ccache git lzop lz4 xz-utils device-tree-compiler python3 python3-pip libelf-dev

                                                                    - name: Clone GCC 4.9 ARM Toolchain
                                                                            run: |
                                                                                      git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git toolchain

                                                                                            - name: Clone Exynos 3475 Kernel (LineageOS 19.1 base)
                                                                                                    run: |
                                                                                                              git clone --depth=1 https://github.com/kOtusin/android_kernel_samsung_exynos3475.git -b lineage-19.1 kernel
                                                                                                              
                                                                                                                    - name: Apply Camera Patches
                                                                                                                            run: |
                                                                                                                                      cd kernel
                                                                                                                                                find drivers/media/ -name "*flite*.c" -exec sed -i 's/request_irq(\([^,]*\), \([^,]*\), 0,/request_irq(\1, \2, IRQF_SHARED,/g' {} +
                                                                                                                                                          find arch/arm/boot/dts/ -name "*3475*.dts*" -exec sed -i 's/gpio_standby = <&gpc2 [0-9] [0-9]>/gpio_standby = <\&gpf0 2 1>/g' {} +
                                                                                                                                                          
                                                                                                                                                                - name: Apply Android 14 Kernel Backports
                                                                                                                                                                        run: |
                                                                                                                                                                                  cd kernel
                                                                                                                                                                                            cat > mm/memfd.c << 'MEMFD_EOF'
                                                                                                                                                                                                      #include <linux/fs.h>
                                                                                                                                                                                                                #include <linux/slab.h>
                                                                                                                                                                                                                          #include <linux/anon_inodes.h>
                                                                                                                                                                                                                                    #include <linux/syscalls.h>
                                                                                                                                                                                                                                              #include <linux/uaccess.h>
                                                                                                                                                                                                                                                        #include <linux/shmem_fs.h>
                                                                                                                                                                                                                                                                  #define MFD_CLOEXEC 0x0001U
                                                                                                                                                                                                                                                                            #define MFD_ALLOW_SEALING 0x0002U
                                                                                                                                                                                                                                                                                      #define MFD_NAME_PREFIX "memfd:"
                                                                                                                                                                                                                                                                                                #define MFD_NAME_PREFIX_LEN (sizeof(MFD_NAME_PREFIX) - 1)
                                                                                                                                                                                                                                                                                                          #define MFD_NAME_MAX_LEN (255 - MFD_NAME_PREFIX_LEN)
                                                                                                                                                                                                                                                                                                                    SYSCALL_DEFINE2(memfd_create, const char __user *, uname, unsigned int, flags) {
                                                                                                                                                                                                                                                                                                                                  struct file *file; int fd, error; char *name; long len;
                                                                                                                                                                                                                                                                                                                                                if (flags & ~(MFD_CLOEXEC | MFD_ALLOW_SEALING)) return -EINVAL;
                                                                                                                                                                                                                                                                                                                                                              len = strnlen_user(uname, MFD_NAME_MAX_LEN + 1);
                                                                                                                                                                                                                                                                                                                                                                            if (len <= 0) return -EFAULT;
                                                                                                                                                                                                                                                                                                                                                                                          if (len > MFD_NAME_MAX_LEN + 1) return -EINVAL;
                                                                                                                                                                                                                                                                                                                                                                                                        name = kmalloc(len + MFD_NAME_PREFIX_LEN, GFP_TEMPORARY);
                                                                                                                                                                                                                                                                                                                                                                                                                      if (!name) return -ENOMEM;
                                                                                                                                                                                                                                                                                                                                                                                                                                    strcpy(name, MFD_NAME_PREFIX);
                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (copy_from_user(&name[MFD_NAME_PREFIX_LEN], uname, len)) { kfree(name); return -EFAULT; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                name[len + MFD_NAME_PREFIX_LEN - 1] = 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              fd = get_unused_fd_flags((flags & MFD_CLOEXEC) ? O_CLOEXEC : 0);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (fd < 0) { kfree(name); return fd; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          file = shmem_file_setup(name, 0, VM_NORESERVE);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (IS_ERR(file)) { error = PTR_ERR(file); put_unused_fd(fd); kfree(name); return error; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      file->f_mode |= FMODE_LSEEK | FMODE_PREAD | FMODE_PWRITE;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    file->f_flags |= O_LARGEFILE;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  fd_install(fd, file); kfree(name); return fd;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      MEMFD_EOF
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                echo "obj-y += memfd.o" >> mm/Makefile
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          echo "#define __NR_memfd_create (__NR_SYSCALL_BASE+385)" >> arch/arm/include/uapi/asm/unistd.h
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    echo "/* 385 */ CALL(sys_memfd_create)" >> arch/arm/kernel/calls.S
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              cat > kernel/bpf_stub.c << 'BPF_EOF'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        #include <linux/types.h>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  #include <linux/syscalls.h>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            #include <linux/anon_inodes.h>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      #include <linux/slab.h>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                #include <linux/uaccess.h>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          #define BPF_MAP_CREATE 0
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    #define BPF_MAP_LOOKUP_ELEM 1
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              #define BPF_MAP_UPDATE_ELEM 2
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        #define BPF_MAP_DELETE_ELEM 3
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  #define BPF_MAP_GET_NEXT_KEY 4
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            #define BPF_PROG_LOAD 5
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      static const struct file_operations bpf_map_fops = { .owner = THIS_MODULE };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                SYSCALL_DEFINE3(bpf, int, cmd, void __user *, uattr, unsigned int, size) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (!capable(CAP_NET_ADMIN) && !capable(CAP_SYS_ADMIN)) return -EPERM;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            switch (cmd) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          case BPF_MAP_CREATE: return anon_inode_getfd("[bpf-map]", &bpf_map_fops, NULL, O_RDWR|O_CLOEXEC);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        case BPF_MAP_LOOKUP_ELEM:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      case BPF_MAP_UPDATE_ELEM:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    case BPF_MAP_DELETE_ELEM:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  case BPF_MAP_GET_NEXT_KEY: return -ENOENT;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                case BPF_PROG_LOAD: return -EPERM;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              default: return -EINVAL;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                BPF_EOF
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          echo "obj-y += bpf_stub.o" >> kernel/Makefile
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    echo "#define __NR_bpf (__NR_SYSCALL_BASE+386)" >> arch/arm/include/uapi/asm/unistd.h
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              echo "#define __NR_faccessat2 (__NR_SYSCALL_BASE+439)" >> arch/arm/include/uapi/asm/unistd.h
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        echo "/* 386 */ CALL(sys_bpf)" >> arch/arm/kernel/calls.S
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              - name: Update Defconfig for Android 14
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                cd kernel
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          DEFCONFIG="arch/arm/configs/lineage-j1xlte_defconfig"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    for opt in CONFIG_FTRACE CONFIG_FUNCTION_TRACER CONFIG_DYNAMIC_FTRACE CONFIG_FUNCTION_GRAPH_TRACER CONFIG_DEBUG_INFO CONFIG_LOCKDEP CONFIG_PROVE_LOCKING CONFIG_EXFAT_FS CONFIG_DVB; do
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                sed -i "/${opt}/d" $DEFCONFIG
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          done
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    cat >> $DEFCONFIG << 'DEFCONFIG_EOF'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              CONFIG_MEMFD_CREATE=y
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        CONFIG_CGROUPS=y
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  CONFIG_CGROUP_SCHED=y
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            CONFIG_CGROUP_PIDS=y
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      CONFIG_CGROUP_FREEZER=y
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                CONFIG_CGROUP_DEVICE=y
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          CONFIG_CGROUP_CPUACCT=y
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    CONFIG_MEMCG=y
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              CONFIG_MEMCG_SWAP=y
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        CONFIG_BPF_SYSCALL=y
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  CONFIG_NET_CLS_BPF=y
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            CONFIG_NET_ACT_BPF=y
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      CONFIG_ZRAM=y
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                CONFIG_ZSMALLOC=y
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          CONFIG_CRYPTO_LZ4=y
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    DEFCONFIG_EOF
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          - name: Build Kernel and DTBs
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            cd kernel
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      export ARCH=arm
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/bin/arm-linux-androideabi-
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          make lineage-j1xlte_defconfig
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    make -j$(nproc) zImage dtbs
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          - name: Upload Artifact
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          with:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    name: zImage-Android14-Ready
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              path: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          kernel/arch/arm/boot/zImage
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      kernel/arch/arm/boot/dts/*.dtb
